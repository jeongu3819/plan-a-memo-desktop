# PLAN-A Memo 업데이트 파일(정적) — staging.planawork.com 의 server { } 블록 안에 넣는다.
# SPA fallback(location / 의 try_files ... /index.html)보다 먼저 잡히도록 ^~ 를 쓴다. 없는 파일은 웹 화면 HTML 200 이 아니라 404 다.
# server 수준에 error_page 404 가 있어도 물려받지 않도록 location 안에서 다시 정한다.
location ^~ /memo-updates/ {
    root /var/www;                # 파일 위치: /var/www/memo-updates/staging/...
    autoindex off;
    default_type application/octet-stream;
    error_page 404 = @memo_updates_404;
    try_files $uri =404;

    # 올리는 중인 임시 폴더·파일(.incoming-*)은 내보내지 않는다.
    location ~ /\. { deny all; }

    # 앱이 확인하는 파일 — 게시 순서가 지켜지도록 캐시하지 않는다.
    location ~ /(latest|latest\.previous|probe)\.json$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 버전 폴더의 파일은 한 번 올리면 바뀌지 않는다.
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location @memo_updates_404 {
    default_type text/plain;
    return 404 "not found\n";
}
